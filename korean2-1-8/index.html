<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="초등학교 2학년 국어 8단원 다양한 작품을 감상해요 2회 오답 분석 리포트">
    <title>초2-1 국어 8단원 2회 오답 분석 리포트</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #8e5cc7;
            --primary-dark: #6f3ea8;
            --secondary: #e8899c;
            --soft-purple: #f3edfb;
            --soft-pink: #fff0f4;
            --soft-yellow: #fff8dc;
            --border: #e5d7f2;
            --text: #30343b;
            --muted: #6b7280;
            --danger: #d94f4f;
            --warning: #e8a23a;
            --success: #2f9e72;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px 50px;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            color: var(--text);
            background: linear-gradient(180deg, #f4effb 0%, #fcfaff 100%);
        }

        .container {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 30px;
            background: #ffffff;
            border-top: 9px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(111, 62, 168, 0.12);
        }

        h1 {
            margin: 0;
            padding-bottom: 16px;
            color: var(--primary-dark);
            font-size: 28px;
            line-height: 1.4;
            text-align: center;
            border-bottom: 2px dashed #cdb3e6;
        }

        .unit-title {
            display: block;
            margin-top: 6px;
            color: var(--secondary);
            font-size: 17px;
        }

        .desc {
            margin: 20px auto 12px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            text-align: center;
        }

        .selection-status {
            margin: 0 0 18px;
            color: var(--primary-dark);
            font-size: 15px;
            font-weight: 700;
            text-align: center;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .checkbox-label {
            display: flex;
            min-height: 72px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 6px;
            color: var(--primary-dark);
            font-weight: 700;
            background: var(--soft-purple);
            border: 1px solid #dccbf0;
            border-radius: 11px;
            cursor: pointer;
            user-select: none;
            transition:
                transform 0.18s ease,
                background-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .checkbox-label:hover {
            transform: translateY(-2px);
            background: #e9def7;
            box-shadow: 0 5px 10px rgba(142, 92, 199, 0.13);
        }

        .checkbox-label.selected {
            color: #ffffff;
            background: var(--primary);
            border-color: var(--primary);
        }

        input[type="checkbox"] {
            width: 19px;
            height: 19px;
            margin: 0;
            accent-color: var(--secondary);
            cursor: pointer;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        button {
            min-height: 54px;
            padding: 14px 18px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                background-color 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .analyze-button {
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 5px 12px rgba(142, 92, 199, 0.25);
        }

        .analyze-button:hover {
            background: var(--primary-dark);
        }

        .reset-button {
            color: #52606d;
            background: #edf0f4;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #fcfaff;
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 26px;
        }

        .summary-card {
            padding: 17px 10px;
            text-align: center;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(111, 62, 168, 0.06);
        }

        .summary-label {
            display: block;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 13px;
        }

        .summary-value {
            display: block;
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: 800;
        }

        .wrong-list {
            margin: 0 0 25px;
            padding: 14px 16px;
            color: #4d5568;
            line-height: 1.7;
            background: var(--soft-yellow);
            border: 1px solid #efdf9d;
            border-radius: 10px;
        }

        .chart-title,
        .feedback-heading {
            margin: 0 0 15px;
            color: var(--primary-dark);
            font-size: 20px;
        }

        .chart-note {
            margin: -7px 0 15px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            margin: 0 auto 34px;
        }

        .feedback-item {
            margin-top: 15px;
            padding: 17px;
            background: #ffffff;
            border-left: 6px solid var(--success);
            border-radius: 8px;
            box-shadow: 0 3px 9px rgba(111, 62, 168, 0.07);
        }

        .feedback-item.high {
            border-left-color: var(--danger);
        }

        .feedback-item.medium {
            border-left-color: var(--warning);
        }

        .feedback-item.low {
            border-left-color: var(--success);
        }

        .feedback-title {
            display: block;
            margin-bottom: 9px;
            color: #6c399f;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.55;
        }

        .feedback-item p {
            margin: 0;
            color: #4c5968;
            line-height: 1.65;
        }

        .practice-tip {
            margin-top: 10px !important;
            padding: 10px 12px;
            background: var(--soft-pink);
            border-radius: 7px;
        }

        .print-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .print-button {
            min-height: 44px;
            padding: 10px 15px;
            color: #ffffff;
            background: var(--secondary);
            font-size: 14px;
        }

        @media (max-width: 620px) {
            body {
                padding: 12px 10px 30px;
            }

            .container {
                padding: 22px 15px;
                border-radius: 14px;
            }

            h1 {
                font-size: 23px;
            }

            .unit-title {
                font-size: 15px;
            }

            .question-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 9px;
            }

            .checkbox-label {
                min-height: 66px;
                font-size: 14px;
            }

            .button-row {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            #result {
                padding: 18px 13px;
            }
        }

        @media print {
            body {
                padding: 0;
                background: #ffffff;
            }

            .container {
                max-width: none;
                box-shadow: none;
                border: 0;
            }

            .question-grid,
            .button-row,
            .selection-status,
            .desc,
            .print-row {
                display: none;
            }

            #result {
                display: block !important;
                padding: 0;
                border: 0;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>
            📖 초2 국어 8단원 2회 오답 분석
            <span class="unit-title">8. 다양한 작품을 감상해요</span>
        </h1>

        <p class="desc">
            틀린 문제 번호를 모두 선택한 뒤
            <strong>[부족한 학습 영역 분석하기]</strong>를 눌러 주세요.
        </p>

        <p class="selection-status" id="selectionStatus">
            현재 선택한 오답: 0개
        </p>

        <section
            class="question-grid"
            id="checkboxes"
            aria-label="틀린 문제 번호 선택">
        </section>

        <div class="button-row">
            <button
                type="button"
                class="analyze-button"
                onclick="analyze()">
                부족한 학습 영역 분석하기 🚀
            </button>

            <button
                type="button"
                class="reset-button"
                onclick="resetSelection()">
                선택 초기화
            </button>
        </div>

        <section id="result" aria-live="polite">
            <div class="summary-grid">
                <div class="summary-card">
                    <span class="summary-label">선택한 오답</span>
                    <span class="summary-value" id="wrongCount">0개</span>
                </div>

                <div class="summary-card">
                    <span class="summary-label">단순 환산 점수</span>
                    <span class="summary-value" id="estimatedScore">0점</span>
                </div>

                <div class="summary-card">
                    <span class="summary-label">보충 필요 영역</span>
                    <span class="summary-value" id="weakAreaCount">0개</span>
                </div>
            </div>

            <div class="wrong-list" id="wrongList"></div>

            <h2 class="chart-title">📊 영역별 학습 도달도</h2>

            <p class="chart-note">
                100점에 가까울수록 해당 영역을 잘 이해한 것입니다.
            </p>

            <div class="chart-container">
                <canvas id="radarChart"></canvas>
            </div>

            <div id="feedbackText"></div>

            <div class="print-row">
                <button
                    type="button"
                    class="print-button"
                    onclick="window.print()">
                    결과 인쇄하기
                </button>
            </div>
        </section>
    </main>

    <noscript>
        이 페이지의 분석 기능을 사용하려면
        브라우저에서 자바스크립트를 켜 주세요.
    </noscript>

    <script>
        const concepts = {
            "시의 내용과 글쓴이의 생각 파악": {
                shortLabel: "시 내용·생각",
                questions: [1, 2, 6],

                text:
                    "시의 장면과 표현을 바탕으로 글쓴이의 생각이나 인물의 마음을 짐작하는 영역입니다.",

                tip:
                    "시에서 반복되거나 강조된 말을 찾아보고, " +
                    "그 표현을 통해 어떤 마음을 나타내는지 한 문장으로 말해 보세요."
            },

            "작품과 경험 연결·감상하기": {
                shortLabel: "경험·감상",
                questions: [3, 20],

                text:
                    "작품의 내용과 비슷한 자신의 경험을 떠올리고, " +
                    "기억에 남는 장면에 대한 생각과 느낌을 알맞게 표현하는 영역입니다.",

                tip:
                    "‘나도 비슷한 일이 있었나?’, ‘왜 이 장면이 기억에 남았나?’를 생각한 뒤 " +
                    "경험이나 느낌과 그 까닭을 함께 말해 보세요."
            },

            "인물의 마음 짐작하기": {
                shortLabel: "인물의 마음",
                questions: [4, 5, 14, 16, 19],

                text:
                    "그림이나 글 속 인물의 표정, 말, 행동을 바탕으로 " +
                    "놀람, 고마움, 미안함, 조급함과 같은 마음을 짐작하는 영역입니다.",

                tip:
                    "인물의 표정과 행동에 표시한 뒤 " +
                    "‘○○했기 때문에 ○○한 마음이다’로 까닭과 함께 설명해 보세요."
            },

            "작품의 세부 내용 파악": {
                shortLabel: "세부 내용",
                questions: [7, 9, 11, 12, 15, 17],

                text:
                    "시, 이야기, 인형극에 직접 나타난 행동과 사건을 정확하게 찾아내는 영역입니다.",

                tip:
                    "문제에서 묻는 인물이나 행동에 밑줄을 긋고, " +
                    "본문에서 같은 말이나 비슷한 표현을 찾아 확인해 보세요."
            },

            "행동의 까닭과 생각 추론": {
                shortLabel: "까닭·생각",
                questions: [13, 18],

                text:
                    "인물의 말과 행동을 보고 그 까닭이나 속마음을 추론하는 영역입니다.",

                tip:
                    "행동 앞뒤의 내용을 함께 읽고 " +
                    "‘왜 이렇게 말했을까?’, ‘무엇을 기대했을까?’를 생각해 보세요."
            },

            "시어의 뜻과 표현 이해": {
                shortLabel: "시어 이해",
                questions: [8],

                text:
                    "시 속에 사용된 흉내 내는 말이나 모양을 나타내는 말의 뜻을 이해하는 영역입니다.",

                tip:
                    "‘휘휘’, ‘폴짝폴짝’처럼 움직임을 나타내는 말을 직접 몸으로 표현하며 뜻을 익혀 보세요."
            },

            "시 낭송 방법 이해": {
                shortLabel: "시 낭송",
                questions: [10],

                text:
                    "시의 내용과 느낌을 살려 몸짓, 표정, 주고받기 등 알맞은 방법으로 낭송하는 영역입니다.",

                tip:
                    "시를 읽을 때 어떤 부분에서 몸짓이나 표정을 넣으면 좋을지 표시한 뒤 직접 낭송해 보세요."
            }
        };

        let myChart = null;

        function createQuestionCheckboxes() {
            const checkboxContainer =
                document.getElementById("checkboxes");

            for (let number = 1; number <= 20; number++) {
                const label = document.createElement("label");
                label.className = "checkbox-label";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = number;

                checkbox.setAttribute(
                    "aria-label",
                    `${number}번 오답 선택`
                );

                checkbox.addEventListener("change", function () {
                    label.classList.toggle(
                        "selected",
                        checkbox.checked
                    );

                    updateSelectionStatus();
                });

                const numberText = document.createElement("span");
                numberText.textContent = `${number}번`;

                label.appendChild(checkbox);
                label.appendChild(numberText);
                checkboxContainer.appendChild(label);
            }
        }

        function getWrongNumbers() {
            const checkedBoxes = document.querySelectorAll(
                '#checkboxes input[type="checkbox"]:checked'
            );

            return Array.from(checkedBoxes)
                .map((checkbox) => Number(checkbox.value))
                .sort((a, b) => a - b);
        }

        function updateSelectionStatus() {
            const wrongNumbers = getWrongNumbers();
            const status =
                document.getElementById("selectionStatus");

            if (wrongNumbers.length === 0) {
                status.textContent = "현재 선택한 오답: 0개";
                return;
            }

            status.textContent =
                `현재 선택한 오답: ${wrongNumbers.length}개 ` +
                `(${wrongNumbers.join(", ")}번)`;
        }

        function getSeverityClass(errorRate) {
            if (errorRate >= 67) {
                return "high";
            }

            if (errorRate >= 34) {
                return "medium";
            }

            return "low";
        }

        function getSeverityText(errorRate) {
            if (errorRate >= 67) {
                return "집중 보충 필요";
            }

            if (errorRate >= 34) {
                return "추가 연습 필요";
            }

            return "일부 확인 필요";
        }

        function analyze() {
            try {
                const wrongNumbers = getWrongNumbers();

                if (wrongNumbers.length === 0) {
                    alert("틀린 문항을 한 개 이상 선택해 주세요.");
                    return;
                }

                const analysisResults =
                    Object.entries(concepts).map(
                        ([conceptName, conceptData]) => {
                            const wrongQuestions =
                                conceptData.questions.filter(
                                    (question) =>
                                        wrongNumbers.includes(question)
                                );

                            const errorRate = Math.round(
                                (
                                    wrongQuestions.length /
                                    conceptData.questions.length
                                ) * 100
                            );

                            return {
                                conceptName,
                                ...conceptData,
                                wrongQuestions,
                                errorRate,
                                masteryRate: 100 - errorRate
                            };
                        }
                    );

                const weakResults = analysisResults
                    .filter(
                        (result) =>
                            result.wrongQuestions.length > 0
                    )
                    .sort((a, b) => {
                        if (b.errorRate !== a.errorRate) {
                            return b.errorRate - a.errorRate;
                        }

                        return (
                            b.wrongQuestions.length -
                            a.wrongQuestions.length
                        );
                    });

                const simpleScore = Math.max(
                    0,
                    100 - wrongNumbers.length * 5
                );

                document.getElementById(
                    "wrongCount"
                ).textContent = `${wrongNumbers.length}개`;

                document.getElementById(
                    "estimatedScore"
                ).textContent = `${simpleScore}점`;

                document.getElementById(
                    "weakAreaCount"
                ).textContent = `${weakResults.length}개`;

                document.getElementById("wrongList").innerHTML =
                    `<strong>선택한 오답 문항:</strong> ` +
                    `${wrongNumbers.join(", ")}번` +
                    `<br>` +
                    `<span style="font-size:13px;">` +
                    `※ 환산 점수는 20문항을 문항당 5점으로 계산한 참고값입니다.` +
                    `</span>`;

                renderFeedback(weakResults);
                renderChart(analysisResults);

                const resultDiv =
                    document.getElementById("result");

                resultDiv.style.display = "block";

                resultDiv.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            } catch (error) {
                console.error(error);

                alert(
                    "분석 중 오류가 발생했습니다. " +
                    "새로고침 후 다시 시도해 주세요."
                );
            }
        }

        function renderFeedback(weakResults) {
            const feedbackTextDiv =
                document.getElementById("feedbackText");

            let feedbackHTML =
                `<h2 class="feedback-heading">` +
                `🔍 영역별 맞춤 학습 코멘트` +
                `</h2>`;

            weakResults.forEach((result) => {
                const severityClass =
                    getSeverityClass(result.errorRate);

                const severityText =
                    getSeverityText(result.errorRate);

                feedbackHTML += `
                    <article class="feedback-item ${severityClass}">
                        <span class="feedback-title">
                            📍 ${result.conceptName}
                            · ${severityText}
                            · 틀린 문항
                            ${result.wrongQuestions.join(", ")}번
                            · 영역 오답률 ${result.errorRate}%
                        </span>

                        <p>${result.text}</p>

                        <p class="practice-tip">
                            <strong>연습 방법:</strong>
                            ${result.tip}
                        </p>
                    </article>
                `;
            });

            feedbackTextDiv.innerHTML = feedbackHTML;
        }

        function renderChart(analysisResults) {
            if (typeof Chart === "undefined") {
                console.warn(
                    "Chart.js를 불러오지 못해 차트가 표시되지 않습니다."
                );
                return;
            }

            if (myChart !== null) {
                myChart.destroy();
            }

            const labels = analysisResults.map(
                (result) => result.shortLabel
            );

            const masteryRates = analysisResults.map(
                (result) => result.masteryRate
            );

            const context = document
                .getElementById("radarChart")
                .getContext("2d");

            myChart = new Chart(context, {
                type: "radar",

                data: {
                    labels: labels,

                    datasets: [
                        {
                            label: "영역별 학습 도달도(%)",
                            data: masteryRates,
                            backgroundColor:
                                "rgba(142, 92, 199, 0.20)",
                            borderColor:
                                "rgba(142, 92, 199, 1)",
                            pointBackgroundColor:
                                "rgba(232, 137, 156, 1)",
                            pointBorderColor: "#ffffff",
                            pointHoverBackgroundColor:
                                "#ffffff",
                            pointHoverBorderColor:
                                "rgba(142, 92, 199, 1)",
                            borderWidth: 2,
                            pointRadius: 4
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: true,

                    scales: {
                        r: {
                            min: 0,
                            max: 100,
                            beginAtZero: true,

                            ticks: {
                                stepSize: 20,
                                backdropColor:
                                    "rgba(255,255,255,0.75)"
                            },

                            pointLabels: {
                                font: {
                                    family: "Malgun Gothic",
                                    size: 12
                                },
                                color: "#3f3f46"
                            },

                            grid: {
                                color:
                                    "rgba(142, 92, 199, 0.20)"
                            },

                            angleLines: {
                                color:
                                    "rgba(142, 92, 199, 0.20)"
                            }
                        }
                    },

                    plugins: {
                        legend: {
                            position: "bottom",

                            labels: {
                                font: {
                                    family: "Malgun Gothic"
                                }
                            }
                        },

                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return (
                                        `${context.dataset.label}: ` +
                                        `${context.raw}점`
                                    );
                                }
                            }
                        }
                    }
                }
            });
        }

        function resetSelection() {
            document.querySelectorAll(
                '#checkboxes input[type="checkbox"]'
            ).forEach((checkbox) => {
                checkbox.checked = false;

                checkbox
                    .closest(".checkbox-label")
                    .classList.remove("selected");
            });

            updateSelectionStatus();

            const resultDiv =
                document.getElementById("result");

            resultDiv.style.display = "none";

            if (myChart !== null) {
                myChart.destroy();
                myChart = null;
            }

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        createQuestionCheckboxes();
    </script>
</body>
</html>
