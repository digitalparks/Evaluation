<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2-1 국어 4단원 분석기</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #27ae60; --bg: #f9f9f9; }
        body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); text-align: center; font-size: 1.4rem; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .q-check { display: none; }
        .q-label { display: block; border: 2px solid #ddd; text-align: center; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .q-check:checked + .q-label { background: #ff7675; border-color: #ff7675; color: white; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.1rem; cursor: pointer; }
        #result { margin-top: 30px; display: none; }
        .feedback { background: #eee; padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 0.9rem; line-height: 1.6; }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 4. 마음을 짐작해요 분석</h1>
    <p style="text-align: center; color: #666;">틀린 문항을 체크해 주세요.</p>
    <div class="grid" id="quizGrid"></div>
    <button onclick="analyze()">분석 결과 보기</button>
    <div id="result">
        <canvas id="radarChart"></canvas>
        <div class="feedback" id="feedback"></div>
    </div>
</div>
<script>
    // HWP 파일 문항 분석표 근거 데이터 
    const questions = [
        { id: 1, cat: "어휘 및 기초" }, { id: 2, cat: "내용 파악" }, { id: 3, cat: "정확한 읽기" },
        { id: 4, cat: "정확한 읽기" }, { id: 5, cat: "어휘 및 기초" }, { id: 6, cat: "정확한 읽기" },
        { id: 7, cat: "내용 파악" }, { id: 8, cat: "어휘 및 기초" }, { id: 9, cat: "정확한 읽기" },
        { id: 10, cat: "어휘 및 기초" }, { id: 11, cat: "내용 파악" }, { id: 12, cat: "어휘 및 기초" },
        { id: 13, cat: "내용 파악" }, { id: 14, cat: "마음 및 표현" }, { id: 15, cat: "마음 및 표현" },
        { id: 16, cat: "마음 및 표현" }, { id: 17, cat: "내용 파악" }, { id: 18, cat: "마음 및 표현" },
        { id: 19, cat: "내용 파악" }, { id: 20, cat: "내용 파악" }
    ];
    const cats = ["어휘 및 기초", "정확한 읽기", "내용 파악", "마음 및 표현"];
    const grid = document.getElementById('quizGrid');
    questions.forEach(q => {
        grid.innerHTML += `<input type="checkbox" class="q-check" id="q${q.id}" value="${q.id}">
                           <label class="q-label" for="q${q.id}">${q.id}</label>`;
    });
    let chart = null;
    function analyze() {
        const checked = Array.from(document.querySelectorAll('.q-check:checked')).map(c => parseInt(c.value));
        const scores = cats.map(c => {
            const total = questions.filter(q => q.cat === c).length;
            const wrong = questions.filter(q => q.cat === c && checked.includes(q.id)).length;
            return ((total - wrong) / total * 100).toFixed(0);
        });
        document.getElementById('result').style.display = 'block';
        if (chart) chart.destroy();
        chart = new Chart(document.getElementById('radarChart'), {
            type: 'radar',
            data: {
                labels: cats,
                datasets: [{ label: '성취도(%)', data: scores, backgroundColor: 'rgba(39, 174, 96, 0.2)', borderColor: '#27ae60' }]
            },
            options: { scales: { r: { min: 0, max: 100 } } }
        });
        let fb = "<strong>💡 선생님의 맞춤 피드백:</strong><br>";
        if(checked.some(id => [14, 18].includes(id))) fb += "- 인물의 마음을 짐작할 때 말투나 표정 등 본문의 단서를 더 꼼꼼히 살펴보세요.<br>";
        if(checked.some(id => [3, 4, 6, 9].includes(id))) fb += "- 겹받침이 있는 낱말을 정확하게 읽는 연습이 필요합니다.<br>";
        if(checked.length === 0) fb += "- 모든 문항을 맞혔네요! 마음 짐작하기 박사님입니다. 🎉";
        document.getElementById('feedback').innerHTML = fb;
    }
</script>
</body>
</html>
