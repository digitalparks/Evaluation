<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="초등학교 2학년 수학 5단원 분류하기 기본1 오답 분석 리포트">
    <title>초2-1 수학 5단원 기본1 오답 분석 리포트</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #4b3db5;
            --secondary: #00a896;
            --background: #f4f2ff;
            --card: #ffffff;
            --soft-purple: #f0edff;
            --soft-green: #eafaf6;
            --soft-yellow: #fff8dc;
            --border: #ded8f5;
            --text: #2f3342;
            --muted: #687083;
            --danger: #e0565b;
            --warning: #e8a23a;
            --success: #2f9e72;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px 50px;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            color: var(--text);
            background: linear-gradient(180deg, #f0edff 0%, #faf9ff 100%);
        }

        .container {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 30px;
            background: var(--card);
            border-top: 9px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(76, 61, 181, 0.12);
        }

        h1 {
            margin: 0;
            padding-bottom: 16px;
            color: var(--primary-dark);
            font-size: 28px;
            line-height: 1.4;
            text-align: center;
            border-bottom: 2px dashed #b8afea;
        }

        .unit-title {
            display: block;
            margin-top: 6px;
            color: var(--secondary);
            font-size: 17px;
        }

        .desc {
            margin: 20px auto 12px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            text-align: center;
        }

        .selection-status {
            margin: 0 0 18px;
            color: var(--primary-dark);
            font-size: 15px;
            font-weight: 700;
            text-align: center;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .checkbox-label {
            display: flex;
            min-height: 72px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 6px;
            color: var(--primary-dark);
            font-weight: 700;
            background: var(--soft-purple);
            border: 1px solid #d9d2fa;
            border-radius: 11px;
            cursor: pointer;
            user-select: none;
            transition:
                transform 0.18s ease,
                background-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .checkbox-label:hover {
            transform: translateY(-2px);
            background: #e4dfff;
            box-shadow: 0 5px 10px rgba(108, 92, 231, 0.13);
        }

        .checkbox-label.selected {
            color: #ffffff;
            background: var(--primary);
            border-color: var(--primary);
        }

        input[type="checkbox"] {
            width: 19px;
            height: 19px;
            margin: 0;
            accent-color: var(--secondary);
            cursor: pointer;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        button {
            min-height: 54px;
            padding: 14px 18px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                background-color 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .analyze-button {
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 5px 12px rgba(108, 92, 231, 0.25);
        }

        .analyze-button:hover {
            background: var(--primary-dark);
        }

        .reset-button {
            color: #52606d;
            background: #edf0f4;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #fbfaff;
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 26px;
        }

        .summary-card {
            padding: 17px 10px;
            text-align: center;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(76, 61, 181, 0.06);
        }

        .summary-label {
            display: block;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 13px;
        }

        .summary-value {
            display: block;
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: 800;
        }

        .wrong-list {
            margin: 0 0 25px;
            padding: 14px 16px;
            color: #4d5568;
            line-height: 1.7;
            background: var(--soft-yellow);
            border: 1px solid #efdf9d;
            border-radius: 10px;
        }

        .chart-title,
        .feedback-heading {
            margin: 0 0 15px;
            color: var(--primary-dark);
            font-size: 20px;
        }

        .chart-note {
            margin: -7px 0 15px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            margin: 0 auto 34px;
        }

        .feedback-item {
            margin-top: 15px;
            padding: 17px;
            background: #ffffff;
            border-left: 6px solid var(--success);
            border-radius: 8px;
            box-shadow: 0 3px 9px rgba(76, 61, 181, 0.07);
        }

        .feedback-item.high {
            border-left-color: var(--danger);
        }

        .feedback-item.medium {
            border-left-color: var(--warning);
        }

        .feedback-item.low {
            border-left-color: var(--success);
        }

        .feedback-title {
            display: block;
            margin-bottom: 9px;
            color: #493aab;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.55;
        }

        .feedback-item p {
            margin: 0;
            color: #4c5968;
            line-height: 1.65;
        }

        .practice-tip {
            margin-top: 10px !important;
            padding: 10px 12px;
            background: var(--soft-green);
            border-radius: 7px;
        }

        .print-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .print-button {
            min-height: 44px;
            padding: 10px 15px;
            color: #ffffff;
            background: var(--secondary);
            font-size: 14px;
        }

        @media (max-width: 620px) {
            body {
                padding: 12px 10px 30px;
            }

            .container {
                padding: 22px 15px;
                border-radius: 14px;
            }

            h1 {
                font-size: 23px;
            }

            .unit-title {
                font-size: 15px;
            }

            .question-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 9px;
            }

            .checkbox-label {
                min-height: 66px;
                font-size: 14px;
            }

            .button-row {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            #result {
                padding: 18px 13px;
            }
        }

        @media print {
            body {
                padding: 0;
                background: #ffffff;
            }

            .container {
                max-width: none;
                box-shadow: none;
                border: 0;
            }

            .question-grid,
            .button-row,
            .selection-status,
            .desc,
            .print-row {
                display: none;
            }

            #result {
                display: block !important;
                padding: 0;
                border: 0;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>
            🔢 초2 수학 5단원 기본1 오답 분석
            <span class="unit-title">5. 분류하기</span>
        </h1>

        <p class="desc">
            틀린 문제 번호를 모두 선택한 뒤
            <strong>[부족한 학습 영역 분석하기]</strong>를 눌러 주세요.
        </p>

        <p class="selection-status" id="selectionStatus">
            현재 선택한 오답: 0개
        </p>

        <section
            class="question-grid"
            id="checkboxes"
            aria-label="틀린 문제 번호 선택">
        </section>

        <div class="button-row">
            <button
                type="button"
                class="analyze-button"
                onclick="analyze()">
                부족한 학습 영역 분석하기 🚀
            </button>

            <button
                type="button"
                class="reset-button"
                onclick="resetSelection()">
                선택 초기화
            </button>
        </div>

        <section id="result" aria-live="polite">
            <div class="summary-grid">
                <div class="summary-card">
                    <span class="summary-label">선택한 오답</span>
                    <span class="summary-value" id="wrongCount">0개</span>
                </div>

                <div class="summary-card">
                    <span class="summary-label">단순 환산 점수</span>
                    <span class="summary-value" id="estimatedScore">0점</span>
                </div>

                <div class="summary-card">
                    <span class="summary-label">보충 필요 영역</span>
                    <span class="summary-value" id="weakAreaCount">0개</span>
                </div>
            </div>

            <div class="wrong-list" id="wrongList"></div>

            <h2 class="chart-title">📊 영역별 학습 도달도</h2>

            <p class="chart-note">
                100점에 가까울수록 해당 영역을 잘 이해한 것입니다.
            </p>

            <div class="chart-container">
                <canvas id="radarChart"></canvas>
            </div>

            <div id="feedbackText"></div>

            <div class="print-row">
                <button
                    type="button"
                    class="print-button"
                    onclick="window.print()">
                    결과 인쇄하기
                </button>
            </div>
        </section>
    </main>

    <noscript>
        이 페이지의 분석 기능을 사용하려면
        브라우저에서 자바스크립트를 켜 주세요.
    </noscript>

    <script>
        /*
         * 2학년 1학기 수학 5단원 '분류하기' 기본1 문항 분석
         * 각 문항은 가장 중심이 되는 평가 영역 한 곳에 배정함.
         */
        const concepts = {
            "알맞은 분류 기준 판단하기": {
                shortLabel: "기준 판단",
                questions: [1, 2, 3, 7],
                text:
                    "누가 분류해도 결과가 같고, 모든 대상을 분명하게 나눌 수 있는 기준인지 판단하는 영역입니다. " +
                    "‘좋아하는 것’, ‘예쁜 것’, ‘맛있는 것’처럼 사람마다 달라질 수 있는 기준과 " +
                    "색깔, 모양, 날개 유무처럼 눈으로 확인할 수 있는 기준을 구별해야 합니다.",
                tip:
                    "기준을 본 뒤 ‘사람마다 답이 달라질까?’, " +
                    "‘모든 물건을 빠짐없이 나눌 수 있을까?’를 확인해 보세요."
            },

            "분류 기준 세우기": {
                shortLabel: "기준 세우기",
                questions: [4, 5, 8],
                text:
                    "물건이나 그림의 공통점과 차이점을 관찰하여 " +
                    "분류할 수 있는 기준을 직접 만드는 영역입니다.",
                tip:
                    "색깔, 모양, 크기, 쓰임, 재료처럼 눈으로 확인할 수 있는 특징을 찾고 " +
                    "‘○○인 것과 ○○이 아닌 것’으로 기준을 말해 보세요."
            },

            "기준을 정해 분류하기": {
                shortLabel: "기준 정해 분류",
                questions: [10, 11, 13],
                text:
                    "스스로 알맞은 기준을 정한 뒤, 모든 대상을 겹치거나 " +
                    "빠뜨리지 않고 나누는 영역입니다.",
                tip:
                    "먼저 기준을 한 문장으로 쓰고, 각 대상이 어느 쪽에 들어가는지 하나씩 확인하세요. " +
                    "마지막에는 빠진 것이나 두 곳에 겹쳐 들어간 것이 없는지 살펴보세요."
            },

            "주어진 기준에 따라 분류하기": {
                shortLabel: "기준 따라 분류",
                questions: [6, 9],
                text:
                    "문제에서 제시한 모양이나 바퀴 수 등의 기준을 정확히 이해하고, " +
                    "알맞은 대상을 골라 분류하는 영역입니다.",
                tip:
                    "기준에서 중요한 낱말에 밑줄을 긋고, " +
                    "그림을 하나씩 보며 조건에 맞는지 확인하는 연습을 해 보세요."
            },

            "분류하고 수 세기": {
                shortLabel: "분류·수 세기",
                questions: [12, 15, 19],
                text:
                    "대상을 종류별로 분류하고, 세면서 표시한 뒤 " +
                    "각 종류의 수를 정확하게 세는 영역입니다.",
                tip:
                    "그림을 셀 때 하나를 셀 때마다 표시하고, 같은 대상을 두 번 세거나 " +
                    "빠뜨리지 않도록 왼쪽부터 차례대로 세어 보세요."
            },

            "분류 결과 비교·해석하기": {
                shortLabel: "결과 해석",
                questions: [16, 17, 18, 20],
                text:
                    "분류하여 센 결과를 보고 특정 종류의 수를 찾거나, " +
                    "가장 많은 것과 가장 적은 것을 비교하는 영역입니다.",
                tip:
                    "각 종류의 수를 숫자로 적은 뒤 크기를 비교하세요. " +
                    "‘가장 많다’는 가장 큰 수, ‘가장 적다’는 가장 작은 수와 연결하면 됩니다."
            },

            "분류하여 세는 좋은 점 알기": {
                shortLabel: "분류의 장점",
                questions: [14],
                text:
                    "대상을 분류하여 세면 종류별 수를 쉽게 알 수 있고, " +
                    "많고 적음을 편리하게 비교할 수 있다는 점을 설명하는 영역입니다.",
                tip:
                    "‘분류하면 무엇을 쉽게 알 수 있을까?’를 생각한 뒤 " +
                    "‘종류별 수를 쉽게 알 수 있고 서로 비교하기 편리합니다.’처럼 문장으로 써 보세요."
            }
        };

        let myChart = null;

        function createQuestionCheckboxes() {
            const checkboxContainer =
                document.getElementById("checkboxes");

            for (let number = 1; number <= 20; number++) {
                const label = document.createElement("label");
                label.className = "checkbox-label";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = number;

                checkbox.setAttribute(
                    "aria-label",
                    `${number}번 오답 선택`
                );

                checkbox.addEventListener("change", function () {
                    label.classList.toggle(
                        "selected",
                        checkbox.checked
                    );

                    updateSelectionStatus();
                });

                const numberText = document.createElement("span");
                numberText.textContent = `${number}번`;

                label.appendChild(checkbox);
                label.appendChild(numberText);
                checkboxContainer.appendChild(label);
            }
        }

        function getWrongNumbers() {
            const checkedBoxes = document.querySelectorAll(
                '#checkboxes input[type="checkbox"]:checked'
            );

            return Array.from(checkedBoxes)
                .map((checkbox) => Number(checkbox.value))
                .sort((a, b) => a - b);
        }

        function updateSelectionStatus() {
            const wrongNumbers = getWrongNumbers();
            const status =
                document.getElementById("selectionStatus");

            if (wrongNumbers.length === 0) {
                status.textContent = "현재 선택한 오답: 0개";
                return;
            }

            status.textContent =
                `현재 선택한 오답: ${wrongNumbers.length}개 ` +
                `(${wrongNumbers.join(", ")}번)`;
        }

        function getSeverityClass(errorRate) {
            if (errorRate >= 67) {
                return "high";
            }

            if (errorRate >= 34) {
                return "medium";
            }

            return "low";
        }

        function getSeverityText(errorRate) {
            if (errorRate >= 67) {
                return "집중 보충 필요";
            }

            if (errorRate >= 34) {
                return "추가 연습 필요";
            }

            return "일부 확인 필요";
        }

        function analyze() {
            try {
                const wrongNumbers = getWrongNumbers();

                if (wrongNumbers.length === 0) {
                    alert("틀린 문항을 한 개 이상 선택해 주세요.");
                    return;
                }

                const analysisResults =
                    Object.entries(concepts).map(
                        ([conceptName, conceptData]) => {
                            const wrongQuestions =
                                conceptData.questions.filter(
                                    (question) =>
                                        wrongNumbers.includes(question)
                                );

                            const errorRate = Math.round(
                                (
                                    wrongQuestions.length /
                                    conceptData.questions.length
                                ) * 100
                            );

                            return {
                                conceptName,
                                ...conceptData,
                                wrongQuestions,
                                errorRate,
                                masteryRate: 100 - errorRate
                            };
                        }
                    );

                const weakResults = analysisResults
                    .filter(
                        (result) =>
                            result.wrongQuestions.length > 0
                    )
                    .sort((a, b) => {
                        if (b.errorRate !== a.errorRate) {
                            return b.errorRate - a.errorRate;
                        }

                        return (
                            b.wrongQuestions.length -
                            a.wrongQuestions.length
                        );
                    });

                const simpleScore = Math.max(
                    0,
                    100 - wrongNumbers.length * 5
                );

                document.getElementById(
                    "wrongCount"
                ).textContent = `${wrongNumbers.length}개`;

                document.getElementById(
                    "estimatedScore"
                ).textContent = `${simpleScore}점`;

                document.getElementById(
                    "weakAreaCount"
                ).textContent = `${weakResults.length}개`;

                document.getElementById("wrongList").innerHTML =
                    `<strong>선택한 오답 문항:</strong> ` +
                    `${wrongNumbers.join(", ")}번` +
                    `<br>` +
                    `<span style="font-size:13px;">` +
                    `※ 환산 점수는 20문항을 문항당 5점으로 ` +
                    `계산한 참고값입니다.` +
                    `</span>`;

                renderFeedback(weakResults);
                renderChart(analysisResults);

                const resultDiv =
                    document.getElementById("result");

                resultDiv.style.display = "block";

                resultDiv.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            } catch (error) {
                console.error(error);

                alert(
                    "분석 중 오류가 발생했습니다. " +
                    "새로고침 후 다시 시도해 주세요."
                );
            }
        }

        function renderFeedback(weakResults) {
            const feedbackTextDiv =
                document.getElementById("feedbackText");

            let feedbackHTML =
                `<h2 class="feedback-heading">` +
                `🔍 영역별 맞춤 학습 코멘트` +
                `</h2>`;

            weakResults.forEach((result) => {
                const severityClass =
                    getSeverityClass(result.errorRate);

                const severityText =
                    getSeverityText(result.errorRate);

                feedbackHTML += `
                    <article class="feedback-item ${severityClass}">
                        <span class="feedback-title">
                            📍 ${result.conceptName}
                            · ${severityText}
                            · 틀린 문항
                            ${result.wrongQuestions.join(", ")}번
                            · 영역 오답률 ${result.errorRate}%
                        </span>

                        <p>
                            ${result.text}
                        </p>

                        <p class="practice-tip">
                            <strong>연습 방법:</strong>
                            ${result.tip}
                        </p>
                    </article>
                `;
            });

            feedbackTextDiv.innerHTML = feedbackHTML;
        }

        function renderChart(analysisResults) {
            if (typeof Chart === "undefined") {
                console.warn(
                    "Chart.js를 불러오지 못해 " +
                    "차트가 표시되지 않습니다."
                );

                return;
            }

            if (myChart !== null) {
                myChart.destroy();
            }

            const labels = analysisResults.map(
                (result) => result.shortLabel
            );

            const masteryRates = analysisResults.map(
                (result) => result.masteryRate
            );

            const context = document
                .getElementById("radarChart")
                .getContext("2d");

            myChart = new Chart(context, {
                type: "radar",

                data: {
                    labels: labels,

                    datasets: [
                        {
                            label: "영역별 학습 도달도(%)",
                            data: masteryRates,
                            backgroundColor:
                                "rgba(108, 92, 231, 0.20)",
                            borderColor:
                                "rgba(108, 92, 231, 1)",
                            pointBackgroundColor:
                                "rgba(0, 168, 150, 1)",
                            pointBorderColor: "#ffffff",
                            pointHoverBackgroundColor:
                                "#ffffff",
                            pointHoverBorderColor:
                                "rgba(108, 92, 231, 1)",
                            borderWidth: 2,
                            pointRadius: 4
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: true,

                    scales: {
                        r: {
                            min: 0,
                            max: 100,
                            beginAtZero: true,

                            ticks: {
                                stepSize: 20,
                                backdropColor:
                                    "rgba(255,255,255,0.75)"
                            },

                            pointLabels: {
                                font: {
                                    family: "Malgun Gothic",
                                    size: 12
                                },
                                color: "#3b3f52"
                            },

                            grid: {
                                color:
                                    "rgba(108, 92, 231, 0.20)"
                            },

                            angleLines: {
                                color:
                                    "rgba(108, 92, 231, 0.20)"
                            }
                        }
                    },

                    plugins: {
                        legend: {
                            position: "bottom",

                            labels: {
                                font: {
                                    family: "Malgun Gothic"
                                }
                            }
                        },

                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return (
                                        `${context.dataset.label}: ` +
                                        `${context.raw}점`
                                    );
                                }
                            }
                        }
                    }
                }
            });
        }

        function resetSelection() {
            document.querySelectorAll(
                '#checkboxes input[type="checkbox"]'
            ).forEach((checkbox) => {
                checkbox.checked = false;

                checkbox
                    .closest(".checkbox-label")
                    .classList.remove("selected");
            });

            updateSelectionStatus();

            const resultDiv =
                document.getElementById("result");

            resultDiv.style.display = "none";

            if (myChart !== null) {
                myChart.destroy();
                myChart = null;
            }

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        createQuestionCheckboxes();
    </script>
</body>
</html>
