<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 1학기 단원평가 분석</title>
    <style>
        :root {
            --ko-color-1: #f39c12;
            --ko-color-2: #e67e22;
            --ko-color-3: #d35400;
            --ma-color: #5dade2;
        }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 50px; font-size: 2.2rem; color: #333; }
        
        .main-container {
            display: flex;
            gap: 40px;
            max-width: 1000px;
            width: 100%;
        }

        .subject-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .subject-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 3px solid;
        }

        .ko-title { color: #27ae60; border-color: #27ae60; }
        .ma-title { color: #2980b9; border-color: #2980b9; }

        /* 공통 버튼 스타일 */
        .ko-btn, .ma-btn {
            display: block;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .ko-btn:hover, .ma-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* 국어 버튼 색상 (점점 진해지는 효과) */
        .ko-unit1 { background-color: #f39c12; }
        .ko-unit2 { background-color: #e67e22; }
        .ko-unit3 { background-color: #d35400; }
        .ko-unit4 { background-color: #c0392b; } /* 4단원용 새로운 진한 색상 */

        /* 수학 버튼 색상 */
        .ma-btn { background-color: #5dade2; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <h1>📋 2학년 1학기 단원평가 분석</h1>

    <div class="main-container">
        <div class="subject-column">
            <div class="subject-title ko-title">📖 국어</div>
            <a href="./korean2-1-1/index.html" class="ko-btn ko-unit1">1단원 (만나서 반가워요!)</a>
            <a href="./korean2-1-2/index.html" class="ko-btn ko-unit2">2단원 (말의 재미가 솔솔)</a>
            <a href="./korean2-1-3/index.html" class="ko-btn ko-unit3">3단원 (겪은 일을 나타내요)</a>
            <a href="./korean2-1-4/index.html" class="ko-btn ko-unit4">4단원 (마음을 짐작해요)</a>
        </div>

        <div class="subject-column">
            <div class="subject-title ma-title">🔢 수학</div>
            <a href="./math2-1-1/index.html" class="ma-btn">1단원 (세 자리 수)</a>
            <a href="./math2-1-2/index.html" class="ma-btn">2단원 (여러 가지 도형)</a>
            <a href="./math2-1-3/index.html" class="ma-btn">3단원 (덧셈과 뺄셈)</a>
            <div style="padding: 20px; text-align: center; color: #ccc; border: 2px dashed #ddd; border-radius: 10px;">4단원 준비 중</div>
        </div>
    </div>

</body>
</html>
