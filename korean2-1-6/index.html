<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 국어 6단원 단원평가 오답 분석 리포트</title>
  <!-- Chart.js 라이브러리 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* 기본 및 레이아웃 설정 (국어 과목 테마 규칙 반영) */
    :root {
      --bg-color: #f4fdf8;
      --card-border-top: 8px solid #2ecc71;
      --title-color: #27ae60;
      --checkbox-bg: #e8f8f5;
      --checkbox-hover: #d1f2eb;
      --btn-color: #2ecc71;
      --btn-hover: #27ae60;
      --btn-shadow: 0 4px 6px rgba(46, 204, 113, 0.3);
      --result-bg: #f0fcf6;
      --feedback-border: 5px solid #f39c12;
      --feedback-title-color: #d35400;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #2c3e50;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 10px;
    }

    /* 카드 스타일링 */
    .card {
      background: #ffffff;
      border-radius: 16px;
      border-top: var(--card-border-top);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 30px;
      margin-bottom: 25px;
      transition: transform 0.3s ease;
    }

    /* 헤더 영역 */
    .header-zone {
      text-align: center;
      margin-bottom: 30px;
    }

    .main-title {
      color: var(--title-color);
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 10px 0;
    }

    .sub-title {
      font-size: 16px;
      color: #7f8c8d;
      margin: 0;
    }

    /* 동적 체크박스 그리드 */
    .grid-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .check-item {
      position: relative;
    }

    .check-item input[type="checkbox"] {
      display: none;
    }

    .check-item label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px 10px;
      background-color: var(--checkbox-bg);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      color: #34495e;
      transition: all 0.2s ease;
      user-select: none;
      border: 2px solid transparent;
    }

    .check-item label:hover {
      background-color: var(--checkbox-hover);
    }

    .check-item input[type="checkbox"]:checked + label {
      background-color: #fce4d6;
      border-color: #e74c3c;
      color: #c0392b;
    }

    .check-item input[type="checkbox"]:checked + label::after {
      content: "✕";
      font-size: 12px;
      margin-top: 4px;
      font-weight: bold;
    }

    /* 분석 버튼 */
    .btn-submit {
      display: block;
      width: 100%;
      background-color: var(--btn-color);
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-submit:hover {
      background-color: var(--btn-hover);
      transform: translateY(-2px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* 결과 리포트 창 영역 */
    .result-container {
      display: none;
      background-color: var(--result-bg);
      border-radius: 16px;
      padding: 30px;
      margin-top: 30px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
    }

    .result-header {
      border-bottom: 2px dashed #bdc3c7;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .chart-wrapper {
      position: relative;
      margin: 0 auto 35px auto;
      max-width: 450px;
    }

    /* 상세 피드백 영역 */
    .feedback-section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .feedback-card {
      background: #ffffff;
      border-left: var(--feedback-border);
      border-radius: 0 12px 12px 0;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .feedback-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--feedback-title-color);
      margin: 0 0 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .feedback-score-badge {
      font-size: 13px;
      background: #fdf2e9;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .feedback-text {
      font-size: 14.5px;
      color: #566573;
      margin: 0;
      word-break: keep-all;
    }
    
    .perfect-message {
      text-align: center;
      padding: 40px 20px;
      font-size: 18px;
      font-weight: 700;
      color: var(--title-color);
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 상단 카드 영역 -->
  <div class="card">
    <div class="header-zone">
      <h1 class="main-title">국어 단원평가 오답 분석 시스템</h1>
      <p class="sub-title">5학년 1학기 6단원: 토의하여 해결해요</p>
    </div>

    <div class="grid-title">
      📌 틀린 문항 번호를 모두 선택해 주세요.
    </div>
    
    <!-- 동적으로 생성될 체크박스 컨테이너 -->
    <div class="grid-container" id="questionGrid"></div>

    <button type="button" class="btn-submit" onclick="generateReport()">AI 오답 분석 리포트 생성</button>
  </div>

  <!-- 결과 리포트 창 영역 -->
  <div class="result-container" id="resultArea">
    <div class="result-header">
      <h2 style="margin: 0; font-size: 22px; color: #2c3e50; text-align: center;">📊 성취기준 분석 결과 리포트</h2>
    </div>

    <!-- 방사형 레이더 차트 영역 -->
    <div class="chart-wrapper">
      <canvas id="analysisChart"></canvas>
    </div>

    <!-- 맞춤형 학습 가이드 상세 피드백 -->
    <div id="feedbackWrapper">
      <div class="feedback-section-title">💡 영역별 맞춤형 학습 피드백</div>
      <div id="feedbackContainer"></div>
    </div>
  </div>

</div>

<script>
  // 1. 기본 분석 정보 정의 (총 문항 수 및 과목 성격 반영)
  const totalQuestions = 20;

  // 2. 핵심 개념(Concepts) 데이터 구조 구축 (5학년 1학기 국어 6단원 성취기준 기반)
  const concepts = {
    "토의의 필요성과 절차": { 
      questions: [1, 2, 3, 4, 5], 
      text: "토의가 필요한 상황을 식별하고 토의의 전체적인 흐름(절차)을 이해하는 역량이 보완이 필요해요. 토의는 '토의 주제 정하기 → 의견 마련하기 → 의견 모으기 → 의견 결정하기'의 순서로 진행됩니다. 교과서 194~197쪽의 흐름도를 소리 내어 읽으며 각 단계가 왜 필요한지 다시 복습해 보세요!" 
    },
    "토의 주제 파악 및 의견 마련": { 
      questions: [6, 7, 8, 9, 10], 
      text: "주어진 토의 주제에 적합하고 실천 가능한 의견을 브레인스토밍하는 부분에서 다소 아쉬움이 남았네요. 의견을 세울 때는 항상 '이 의견이 주제와 잘 어울리는가?', '우리가 진짜로 실천할 수 있는가?'를 먼저 고민해야 합니다. 일상 속 고민을 주제로 나만의 의견과 실천 방법을 한 문장으로 쓰는 연습을 해봅시다." 
    },
    "의견을 모으고 판단하는 기준": { 
      questions: [11, 12, 13, 14, 15], 
      text: "여러 사람의 의견 중 어떤 의견이 가장 합리적인지 검토하는 세 가지 판단 기준(주제와의 연관성, 실천 가능성, 공동체의 이익)을 정확히 적용하는 연습이 강화되어야 해요. 문제를 풀 때 각 선지가 이 세 가지 기준에 부합하는지 O, X로 표시해가며 신중하게 검토하는 습관을 길러봅시다." 
    },
    "토의 시 지켜야 할 규칙과 태도": { 
      questions: [16, 17, 18, 19, 20], 
      text: "토의할 때 의견을 주고받는 올바른 대화 규칙 및 경청의 태도 문항에서 보완점이 발견되었어요. 상대방의 의견을 비난하지 않고 끝까지 듣는 태도, 발언권을 얻고 정중하게 말하는 규칙은 완벽히 숙지해야 합니다. 다음 대화 예시문을 읽을 때 등장인물들이 규칙을 잘 지키고 있는지 감시관이 되어 체크해보는 놀이를 추천합니다." 
    }
  };

  // 3. 페이지 로드 시 문항 체크박스 동적 생성 수행
  document.addEventListener("DOMContentLoaded", () => {
    const gridContainer = document.getElementById("questionGrid");
    let gridHTML = "";
    
    for (let i = 1; i <= totalQuestions; i++) {
      gridHTML += `
        <div class="check-item">
          <input type="checkbox" id="q${i}" value="${i}">
          <label for="q${i}">${i}번</label>
        </div>
      `;
    }
    gridContainer.innerHTML = gridHTML;
  });

  // 전역 차트 인스턴스 관리를 위한 변수
  let analysisChart = null;

  // 4. 분석 리포트 생성 핵심 기능 함수
  function generateReport() {
    // 선택된 오답 배열 추출
    const checkedBoxes = document.querySelectorAll('#questionGrid input[type="checkbox"]:checked');
    const wrongAnswers = Array.from(checkedBoxes).map(cb => parseInt(cb.value));

    // 각 개념그룹별 데이터 연산 수행
    const conceptNames = Object.keys(concepts);
    const masteryScores = []; // 정답 수 기록 배열
    const maxGroupSizes = [];  // 각 그룹별 총 문항 수 저장 배열 (suggestedMax 산출용)

    let feedbackHTML = "";
    let overallWrongCount = wrongAnswers.length;

    conceptNames.forEach(name => {
      const groupQuestions = concepts[name].questions;
      maxGroupSizes.push(groupQuestions.length);

      // 해당 개념 그룹 내에서 오답에 포함되지 않은 문항 개수(정답 수) 연산
      const wrongInGroup = groupQuestions.filter(q => wrongAnswers.includes(q)).length;
      const correctInGroup = groupQuestions.length - wrongInGroup;
      masteryScores.push(correctInGroup);

      // 오답이 존재하는 그룹에 대해 맞춤형 교육 가이드 제공 문맥 생성
      if (wrongInGroup > 0) {
        feedbackHTML += `
          <div class="feedback-card">
            <h4 class="feedback-title">
              <span>📌 ${name}</span>
              <span class="feedback-score-badge">성취도: ${correctInGroup}/${groupQuestions.length}</span>
            </h4>
            <p class="feedback-text">${concepts[name].text}</p>
          </div>
        `;
      }
    });

    // 만점(오답 없음)일 때 처리 규칙
    if (overallWrongCount === 0) {
      feedbackHTML = `
        <div class="perfect-message">
          🎉 와우! 완벽해요! 모든 성취기준을 완벽하게 달성했습니다.<br>
          토의의 절차와 규칙을 아주 훌륭하게 이해하고 있군요. 앞으로도 화이팅!
        </div>
      `;
    }

    // 화면에 피드백 렌더링 및 영역 노출
    document.getElementById("feedbackContainer").innerHTML = feedbackHTML;
    const resultArea = document.getElementById("resultArea");
    resultArea.style.display = "block";

    // 스무스 스크롤 이동
    resultArea.scrollIntoView({ behavior: 'smooth' });

    // 5. 차트 유동적 상한치(suggestedMax) 최적화 계산
    const dynamicMax = Math.max(...maxGroupSizes);

    // 6. Chart.js 인스턴스 초기화 및 레이더 차트 드로잉 (국어 테마 색상 규칙 엄격 준수)
    if (analysisChart !== null) {
      analysisChart.destroy();
    }

    const ctx = document.getElementById('analysisChart').getContext('2d');
    analysisChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: conceptNames,
        datasets: [{
          label: '개념별 정답 문항 수 (성취도)',
          data: masteryScores,
          backgroundColor: 'rgba(46, 204, 113, 0.4)',
          borderColor: 'rgba(46, 204, 113, 1)',
          borderWidth: 2,
          pointBackgroundColor: 'rgba(39, 174, 96, 1)',
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'top',
            labels: { font: { weight: 'bold', family: 'Pretendard' } }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const index = context.dataIndex;
                return ` 정답 수: ${context.raw}개 / 전체: ${maxGroupSizes[index]}개`;
              }
            }
          }
        },
        scales: {
          r: {
            angleLines: { display: true, color: '#e2e8f0' },
            grid: { color: '#e2e8f0' },
            pointLabels: {
              font: { size: 12, weight: 'bold', family: 'Pretendard' },
              color: '#34495e'
            },
            ticks: {
              stepSize: 1,
              backdropColor: 'transparent',
              color: '#7f8c8d',
              font: { size: 10 }
            },
            min: 0,
            suggestedMax: dynamicMax
          }
        }
      }
    });
  }
</script>

</body>
</html>
