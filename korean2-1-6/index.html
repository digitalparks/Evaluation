<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>국어 오답 분석 리포트</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4fdf8; font-family: 'Pretendard', sans-serif; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #27ae60; border-left: 8px solid #27ae60; padding-left: 15px; }
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .checkbox-item { background: #e8f8f5; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .checkbox-item:hover { background: #d1f2eb; }
        button { background: #2ecc71; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(46,204,113,0.3); }
        button:hover { background: #27ae60; }
        #feedback-area { margin-top: 30px; }
        .feedback-card { border-left: 5px solid #f39c12; background: #f0fcf6; padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0; }
        .feedback-title { color: #d35400; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>국어 6단원 오답 분석</h1>
    <p>틀린 문항을 모두 선택하고 '분석하기' 버튼을 눌러주세요.</p>
    
    <div id="grid" class="grid-container"></div>
    <button onclick="analyze()">분석하기</button>

    <div id="feedback-area"></div>
    <canvas id="radarChart" style="max-width: 500px; margin: 30px auto;"></canvas>
</div>

<script>
    const totalQuestions = 20;
    const concepts = {
        "예의 바른 표현": { questions: [1, 2], text: "상대방의 마음을 헤아려 바른 언어와 행동으로 표현하는 연습이 필요해요." },
        "글의 핵심 내용": { questions: [3, 4, 5], text: "글 전체의 내용을 관통하는 제목을 찾고, 꼭 필요한 정보를 구분해 보세요." },
        "정보 구조화": { questions: [6, 7, 8, 9, 10], text: "설명하는 글은 중심 정보를 찾는 것이 중요해요. 뿌리의 역할과 같은 인과 관계를 다시 읽어보세요." },
        "인물 추론": { questions: [11, 12, 13, 14, 15, 16, 17], text: "인물의 말과 행동 속에 숨겨진 의도와 까닭을 찾아내는 훈련을 해봅시다." },
        "비판적 이해": { questions: [18, 19, 20], text: "글 속 상황을 객관적으로 보고, 자신의 생각을 논리적으로 말하는 연습을 더 해보아요." }
    };

    const grid = document.getElementById('grid');
    for (let i = 1; i <= totalQuestions; i++) {
        grid.innerHTML += `<div class="checkbox-item"><input type="checkbox" id="q${i}" value="${i}"> <label for="q${i}">${i}번</label></div>`;
    }

    function analyze() {
        const selected = Array.from(document.querySelectorAll('input:checked')).map(el => parseInt(el.value));
        const feedbackArea = document.getElementById('feedback-area');
        feedbackArea.innerHTML = '<h3>학습 가이드</h3>';
        
        let counts = {};
        for (let concept in concepts) {
            const matches = concepts[concept].questions.filter(q => selected.includes(q));
            if (matches.length > 0) {
                feedbackArea.innerHTML += `<div class="feedback-card"><div class="feedback-title">${concept}</div>${concepts[concept].text}</div>`;
            }
            counts[concept] = matches.length;
        }
    }
</script>
</body>
</html>
