<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="초등학교 2학년 국어 6단원 2회 평가 오답 분석 리포트">
    <title>초2-1 국어 6단원 2회 오답 분석 리포트</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #3f7dd9;
            --primary-dark: #285fae;
            --secondary: #52b788;
            --background: #eef6ff;
            --card: #ffffff;
            --soft-blue: #eaf3ff;
            --soft-green: #eefaf4;
            --soft-yellow: #fff8df;
            --border: #d8e7f7;
            --text: #263238;
            --muted: #667085;
            --danger: #e05a5a;
            --warning: #e9a23b;
            --success: #36a269;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px 50px;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: linear-gradient(180deg, #eaf4ff 0%, #f8fbff 100%);
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 30px;
            background: var(--card);
            border-radius: 20px;
            border-top: 9px solid var(--primary);
            box-shadow: 0 12px 30px rgba(39, 91, 148, 0.12);
        }

        h1 {
            margin: 0;
            padding-bottom: 16px;
            color: var(--primary-dark);
            font-size: 28px;
            line-height: 1.35;
            text-align: center;
            border-bottom: 2px dashed #9fc4ef;
        }

        .unit-title {
            display: block;
            margin-top: 6px;
            color: var(--secondary);
            font-size: 17px;
        }

        .desc {
            margin: 20px auto 12px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            text-align: center;
        }

        .selection-status {
            margin: 0 0 18px;
            color: var(--primary-dark);
            font-size: 15px;
            font-weight: 700;
            text-align: center;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .checkbox-label {
            display: flex;
            min-height: 72px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 6px;
            background: var(--soft-blue);
            color: var(--primary-dark);
            font-weight: 700;
            border: 1px solid #cfe2f8;
            border-radius: 11px;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                background-color 0.18s ease,
                box-shadow 0.18s ease;
            user-select: none;
        }

        .checkbox-label:hover {
            transform: translateY(-2px);
            background: #dcecff;
            box-shadow: 0 5px 10px rgba(63, 125, 217, 0.12);
        }

        .checkbox-label:has(input:checked) {
            color: #ffffff;
            background: var(--primary);
            border-color: var(--primary);
        }

        input[type="checkbox"] {
            width: 19px;
            height: 19px;
            margin: 0;
            accent-color: var(--secondary);
            cursor: pointer;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        button {
            min-height: 54px;
            padding: 14px 18px;
            border: 0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                background-color 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .analyze-button {
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 5px 12px rgba(63, 125, 217, 0.25);
        }

        .analyze-button:hover {
            background: var(--primary-dark);
        }

        .reset-button {
            color: #52606d;
            background: #edf1f5;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f9fcff;
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 26px;
        }

        .summary-card {
            padding: 17px 10px;
            text-align: center;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(35, 78, 124, 0.06);
        }

        .summary-label {
            display: block;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 13px;
        }

        .summary-value {
            display: block;
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: 800;
        }

        .wrong-list {
            margin: 0 0 25px;
            padding: 14px 16px;
            color: #4a5568;
            line-height: 1.7;
            background: var(--soft-yellow);
            border: 1px solid #f2df9c;
            border-radius: 10px;
        }

        .chart-title,
        .feedback-heading {
            margin: 0 0 15px;
            color: var(--primary-dark);
            font-size: 20px;
        }

        .chart-note {
            margin: -7px 0 15px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            margin: 0 auto 34px;
        }

        .feedback-item {
            margin-top: 15px;
            padding: 17px;
            background: #ffffff;
            border-left: 6px solid var(--success);
            border-radius: 8px;
            box-shadow: 0 3px 9px rgba(31, 73, 125, 0.07);
        }

        .feedback-item.high {
            border-left-color: var(--danger);
        }

        .feedback-item.medium {
            border-left-color: var(--warning);
        }

        .feedback-item.low {
            border-left-color: var(--success);
        }

        .feedback-title {
            display: block;
            margin-bottom: 9px;
            color: #204f86;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.5;
        }

        .feedback-item p {
            margin: 0;
            color: #4c5968;
            line-height: 1.65;
        }

        .practice-tip {
            margin-top: 10px !important;
            padding: 10px 12px;
            background: var(--soft-green);
            border-radius: 7px;
        }

        .all-good {
            padding: 18px;
            color: #217a4d;
            text-align: center;
            background: var(--soft-green);
            border: 1px solid #bfe7d1;
            border-radius: 10px;
            font-weight: 700;
        }

        .print-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .print-button {
            min-height: 44px;
            padding: 10px 15px;
            color: #ffffff;
            background: var(--secondary);
            font-size: 14px;
        }

        @media (max-width: 620px) {
            body {
                padding: 12px 10px 30px;
            }

            .container {
                padding: 22px 15px;
                border-radius: 14px;
            }

            h1 {
                font-size: 23px;
            }

            .unit-title {
                font-size: 15px;
            }

            .question-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 9px;
            }

            .checkbox-label {
                min-height: 66px;
                font-size: 14px;
            }

            .button-row {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            #result {
                padding: 18px 13px;
            }
        }

        @media print {
            body {
                padding: 0;
                background: #ffffff;
            }

            .container {
                max-width: none;
                box-shadow: none;
                border: 0;
            }

            .question-grid,
            .button-row,
            .selection-status,
            .desc,
            .print-row {
                display: none;
            }

            #result {
                display: block !important;
                border: 0;
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>
            📝 초2 국어 6단원 2회 오답 분석
            <span class="unit-title">
                6. 자신의 생각을 표현해요
            </span>
        </h1>

        <p class="desc">
            틀린 문제 번호를 모두 선택한 뒤
            <strong>[부족한 학습 영역 분석하기]</strong>를 눌러 주세요.
        </p>

        <p class="selection-status" id="selectionStatus">
            현재 선택한 오답: 0개
        </p>

        <section
            class="question-grid"
            id="checkboxes"
            aria-label="틀린 문제 번호 선택">
        </section>

        <div class="button-row">
            <button
                type="button"
                class="analyze-button"
                onclick="analyze()">
                부족한 학습 영역 분석하기 🚀
            </button>

            <button
                type="button"
                class="reset-button"
                onclick="resetSelection()">
                선택 초기화
            </button>
        </div>

        <section id="result" aria-live="polite">
            <div class="summary-grid">
                <div class="summary-card">
                    <span class="summary-label">선택한 오답</span>
                    <span class="summary-value" id="wrongCount">
                        0개
                    </span>
                </div>

                <div class="summary-card">
                    <span class="summary-label">단순 환산 점수</span>
                    <span class="summary-value" id="estimatedScore">
                        0점
                    </span>
                </div>

                <div class="summary-card">
                    <span class="summary-label">보충 필요 영역</span>
                    <span class="summary-value" id="weakAreaCount">
                        0개
                    </span>
                </div>
            </div>

            <div class="wrong-list" id="wrongList"></div>

            <h2 class="chart-title">
                📊 영역별 학습 도달도
            </h2>

            <p class="chart-note">
                100점에 가까울수록 해당 영역을 잘 이해한 것입니다.
            </p>

            <div class="chart-container">
                <canvas id="radarChart"></canvas>
            </div>

            <div id="feedbackText"></div>

            <div class="print-row">
                <button
                    type="button"
                    class="print-button"
                    onclick="window.print()">
                    결과 인쇄하기
                </button>
            </div>
        </section>
    </main>

    <noscript>
        이 페이지의 분석 기능을 사용하려면
        브라우저에서 자바스크립트를 켜 주세요.
    </noscript>

    <script>
        /*
         * 2학년 1학기 국어 6단원 2회 평가 문항 분석
         * 모든 문항은 한 개의 주된 평가 영역에만 배정함.
         */
        const concepts = {
            "광고 내용과 생각·느낌": {
                shortLabel: "광고 내용",
                questions: [1, 2],
                text:
                    "광고 장면에서 인물이 한 행동을 살펴보고, " +
                    "광고가 전하려는 배려의 의미에 맞는 생각이나 " +
                    "느낌을 판단하는 영역입니다.",
                tip:
                    "생활 속 공익 광고를 본 뒤 ‘무슨 행동을 했는지’, " +
                    "‘무엇을 전하려는지’, ‘나는 어떤 생각이 드는지’를 " +
                    "차례로 말해 보세요."
            },

            "글의 중심 내용과 목적": {
                shortLabel: "중심 내용·목적",
                questions: [3, 6, 14],
                text:
                    "글 전체에서 가장 중요한 내용을 찾아 제목, " +
                    "중심 내용, 글을 쓴 목적을 파악하는 영역입니다.",
                tip:
                    "각 문단에서 반복되는 낱말이나 내용을 표시한 뒤, " +
                    "‘이 글은 무엇을 알려 주려고 썼을까?’를 " +
                    "한 문장으로 정리해 보세요."
            },

            "글의 세부 내용 찾기": {
                shortLabel: "세부 내용",
                questions: [4, 7, 10, 11, 15, 16, 18],
                text:
                    "글에 직접 드러난 대상, 행동, 필요한 것, 장소 등의 " +
                    "정보를 빠뜨리지 않고 찾아내는 영역입니다.",
                tip:
                    "문제에서 묻는 핵심 낱말에 밑줄을 긋고, " +
                    "본문에서 같은 낱말이나 비슷한 표현을 찾아 " +
                    "표시하는 연습이 좋습니다."
            },

            "까닭과 근거 파악하기": {
                shortLabel: "까닭·근거",
                questions: [5, 8, 12, 17],
                text:
                    "어떤 사실이나 의견이 나온 까닭을 " +
                    "글 속 근거와 연결해 이해하는 영역입니다.",
                tip:
                    "‘왜냐하면’, ‘~때문입니다’, ‘~거든요’와 같은 " +
                    "까닭을 나타내는 표현을 찾아 앞의 내용과 " +
                    "연결해 읽어 보세요."
            },

            "낱말의 뜻 이해하기": {
                shortLabel: "낱말 뜻",
                questions: [9],
                text:
                    "글의 문맥과 낱말 풀이를 바탕으로 " +
                    "알맞은 낱말의 뜻을 이해하는 영역입니다.",
                tip:
                    "모르는 낱말은 앞뒤 문장을 함께 읽고, " +
                    "그 낱말을 넣어 짧은 예문을 만들어 " +
                    "뜻을 확인해 보세요."
            },

            "인물의 생각 비교하기": {
                shortLabel: "생각 비교",
                questions: [13, 19],
                text:
                    "인물마다 다른 의견과 그 까닭을 구별하고, " +
                    "누구의 생각인지 비교하는 영역입니다.",
                tip:
                    "인물 이름 옆에 ‘가고 싶은 곳·그 까닭’ 또는 " +
                    "‘누구의 말이 옳다고 생각하는지’를 " +
                    "표로 정리해 보세요."
            },

            "자신의 생각 표현하기": {
                shortLabel: "생각 표현",
                questions: [20],
                text:
                    "글 속 인물의 행동에 대한 자신의 생각을 " +
                    "알맞은 까닭과 함께 문장으로 표현하는 영역입니다.",
                tip:
                    "‘나는 호랑이가 ○○하다고 생각합니다. " +
                    "왜냐하면 ○○했기 때문입니다.’의 " +
                    "두 문장 틀로 먼저 써 보세요."
            }
        };

        let myChart = null;

        function createQuestionCheckboxes() {
            const checkboxContainer =
                document.getElementById("checkboxes");

            for (let number = 1; number <= 20; number++) {
                const label = document.createElement("label");
                label.className = "checkbox-label";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = number;
                checkbox.setAttribute(
                    "aria-label",
                    `${number}번 오답 선택`
                );
                checkbox.addEventListener(
                    "change",
                    updateSelectionStatus
                );

                const numberText = document.createElement("span");
                numberText.textContent = `${number}번`;

                label.appendChild(checkbox);
                label.appendChild(numberText);
                checkboxContainer.appendChild(label);
            }
        }

        function getWrongNumbers() {
            const checkedBoxes = document.querySelectorAll(
                '#checkboxes input[type="checkbox"]:checked'
            );

            return Array.from(checkedBoxes)
                .map((checkbox) => Number(checkbox.value))
                .sort((a, b) => a - b);
        }

        function updateSelectionStatus() {
            const wrongNumbers = getWrongNumbers();
            const status =
                document.getElementById("selectionStatus");

            if (wrongNumbers.length === 0) {
                status.textContent = "현재 선택한 오답: 0개";
                return;
            }

            status.textContent =
                `현재 선택한 오답: ${wrongNumbers.length}개 ` +
                `(${wrongNumbers.join(", ")}번)`;
        }

        function getSeverityClass(errorRate) {
            if (errorRate >= 67) {
                return "high";
            }

            if (errorRate >= 34) {
                return "medium";
            }

            return "low";
        }

        function getSeverityText(errorRate) {
            if (errorRate >= 67) {
                return "집중 보충 필요";
            }

            if (errorRate >= 34) {
                return "추가 연습 필요";
            }

            return "일부 확인 필요";
        }

        function analyze() {
            try {
                const wrongNumbers = getWrongNumbers();

                if (wrongNumbers.length === 0) {
                    alert("틀린 문항을 한 개 이상 선택해 주세요.");
                    return;
                }

                const analysisResults =
                    Object.entries(concepts).map(
                        ([conceptName, conceptData]) => {
                            const wrongQuestions =
                                conceptData.questions.filter(
                                    (question) =>
                                        wrongNumbers.includes(question)
                                );

                            const errorRate = Math.round(
                                (
                                    wrongQuestions.length /
                                    conceptData.questions.length
                                ) * 100
                            );

                            const masteryRate = 100 - errorRate;

                            return {
                                conceptName,
                                ...conceptData,
                                wrongQuestions,
                                errorRate,
                                masteryRate
                            };
                        }
                    );

                const weakResults = analysisResults
                    .filter(
                        (result) =>
                            result.wrongQuestions.length > 0
                    )
                    .sort((a, b) => {
                        if (b.errorRate !== a.errorRate) {
                            return b.errorRate - a.errorRate;
                        }

                        return (
                            b.wrongQuestions.length -
                            a.wrongQuestions.length
                        );
                    });

                const simpleScore = Math.max(
                    0,
                    100 - wrongNumbers.length * 5
                );

                document.getElementById(
                    "wrongCount"
                ).textContent = `${wrongNumbers.length}개`;

                document.getElementById(
                    "estimatedScore"
                ).textContent = `${simpleScore}점`;

                document.getElementById(
                    "weakAreaCount"
                ).textContent = `${weakResults.length}개`;

                document.getElementById("wrongList").innerHTML =
                    `<strong>선택한 오답 문항:</strong> ` +
                    `${wrongNumbers.join(", ")}번` +
                    `<br>` +
                    `<span style="font-size:13px;">` +
                    `※ 환산 점수는 20문항을 문항당 5점으로 ` +
                    `계산한 참고값입니다.` +
                    `</span>`;

                renderFeedback(weakResults);
                renderChart(analysisResults);

                const resultDiv =
                    document.getElementById("result");

                resultDiv.style.display = "block";

                resultDiv.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            } catch (error) {
                console.error(error);

                alert(
                    "분석 중 오류가 발생했습니다. " +
                    "새로고침 후 다시 시도해 주세요."
                );
            }
        }

        function renderFeedback(weakResults) {
            const feedbackTextDiv =
                document.getElementById("feedbackText");

            if (weakResults.length === 0) {
                feedbackTextDiv.innerHTML =
                    `<div class="all-good">` +
                    `모든 영역을 잘 이해하고 있습니다. 👍` +
                    `</div>`;

                return;
            }

            let feedbackHTML =
                `<h2 class="feedback-heading">` +
                `🔍 영역별 맞춤 학습 코멘트` +
                `</h2>`;

            weakResults.forEach((result) => {
                const severityClass =
                    getSeverityClass(result.errorRate);

                const severityText =
                    getSeverityText(result.errorRate);

                feedbackHTML += `
                    <article class="feedback-item ${severityClass}">
                        <span class="feedback-title">
                            📍 ${result.conceptName}
                            · ${severityText}
                            · 틀린 문항
                            ${result.wrongQuestions.join(", ")}번
                            · 영역 오답률 ${result.errorRate}%
                        </span>

                        <p>
                            ${result.text}
                        </p>

                        <p class="practice-tip">
                            <strong>연습 방법:</strong>
                            ${result.tip}
                        </p>
                    </article>
                `;
            });

            feedbackTextDiv.innerHTML = feedbackHTML;
        }

        function renderChart(analysisResults) {
            if (typeof Chart === "undefined") {
                console.warn(
                    "Chart.js를 불러오지 못해 " +
                    "차트가 표시되지 않습니다."
                );

                return;
            }

            if (myChart !== null) {
                myChart.destroy();
            }

            const labels = analysisResults.map(
                (result) => result.shortLabel
            );

            const masteryRates = analysisResults.map(
                (result) => result.masteryRate
            );

            const context = document
                .getElementById("radarChart")
                .getContext("2d");

            myChart = new Chart(context, {
                type: "radar",

                data: {
                    labels: labels,

                    datasets: [
                        {
                            label: "영역별 학습 도달도(%)",
                            data: masteryRates,
                            backgroundColor:
                                "rgba(63, 125, 217, 0.20)",
                            borderColor:
                                "rgba(63, 125, 217, 1)",
                            pointBackgroundColor:
                                "rgba(82, 183, 136, 1)",
                            pointBorderColor: "#ffffff",
                            pointHoverBackgroundColor:
                                "#ffffff",
                            pointHoverBorderColor:
                                "rgba(63, 125, 217, 1)",
                            borderWidth: 2,
                            pointRadius: 4
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: true,

                    scales: {
                        r: {
                            min: 0,
                            max: 100,
                            beginAtZero: true,

                            ticks: {
                                stepSize: 20,
                                backdropColor:
                                    "rgba(255,255,255,0.75)"
                            },

                            pointLabels: {
                                font: {
                                    family: "Malgun Gothic",
                                    size: 12
                                },
                                color: "#334155"
                            },

                            grid: {
                                color:
                                    "rgba(112, 144, 176, 0.25)"
                            },

                            angleLines: {
                                color:
                                    "rgba(112, 144, 176, 0.25)"
                            }
                        }
                    },

                    plugins: {
                        legend: {
                            position: "bottom",

                            labels: {
                                font: {
                                    family: "Malgun Gothic"
                                }
                            }
                        },

                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return (
                                        `${context.dataset.label}: ` +
                                        `${context.raw}점`
                                    );
                                }
                            }
                        }
                    }
                }
            });
        }

        function resetSelection() {
            document.querySelectorAll(
                '#checkboxes input[type="checkbox"]'
            ).forEach((checkbox) => {
                checkbox.checked = false;
            });

            updateSelectionStatus();

            const resultDiv =
                document.getElementById("result");

            resultDiv.style.display = "none";

            if (myChart !== null) {
                myChart.destroy();
                myChart = null;
            }

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        createQuestionCheckboxes();
    </script>
</body>
</html>
